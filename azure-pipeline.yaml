
trigger:
  branches:
    include:
      - main

pool: powermanage-pool

steps:
  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: 'latest'

  - task: TerraformTask@5
    inputs:
      displayName: Terraform_init
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
      backendServiceArm: 'BYD_serviceconnection'
      backendAzureRmOverrideSubscriptionID: '82725301-e172-4d2e-920e-a694092383e3'
      backendAzureRmResourceGroupName: 'rg_mohit'
      backendAzureRmStorageAccountName: 'mystorageaccount193'
      backendAzureRmContainerName: 'mycont'
      backendAzureRmKey: 'dev.terraform.tfstate'

  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'custom'
      workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
      outputTo: 'console'
      customCommand: 'fmt'
      environmentServiceNameAzureRM: 'BYD_serviceconnection'
      environmentAzureRmOverrideSubscriptionID: '82725301-e172-4d2e-920e-a694092383e3'

  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'

  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'plan'
      environmentServiceNameAzureRM: 'BYD_serviceconnection'
      environmentAzureRmOverrideSubscriptionID: '82725301-e172-4d2e-920e-a694092383e3'

  